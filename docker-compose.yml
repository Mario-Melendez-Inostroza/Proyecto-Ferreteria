
services:

  # -----------------------------------------------------------
  # POSTGRESQL — bases de datos de los microservicios de negocio
  # -----------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: postgres-ferreteria
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres1234
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - ferreteria-net

  # -----------------------------------------------------------
  # EUREKA — registro y descubrimiento de servicios (Puerto 8761)
  # -----------------------------------------------------------
  eureka:
    build: ./eureka
    container_name: eureka
    restart: always
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8761'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - ferreteria-net

  # -----------------------------------------------------------
  # API GATEWAY — único punto de entrada público (Puerto 8080)
  # -----------------------------------------------------------
  # Reenvía todo el tráfico entrante hacia lb://bff (resuelto vía
  # Eureka). No implementa lógica de autenticación propia; toda
  # la seguridad/orquestación la sigue haciendo el BFF.
  # -----------------------------------------------------------
  apigateway:
    build: ./apigateway
    container_name: apigateway
    restart: always
    depends_on:
      eureka:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka
      EUREKA_INSTANCE_HOSTNAME: apigateway
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      GLITCHTIP_DSN: ${GLITCHTIP_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-docker}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    ports:
      - "8080:8080"
    networks:
      - ferreteria-net

  # -----------------------------------------------------------
  # MS-AUTH — Autenticación y JWT (Puerto 8081, interno)
  # -----------------------------------------------------------
  ms-auth:
    build: ./ms-auth
    container_name: ms-auth
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: auth_db
      DB_USER: postgres
      DB_PASSWORD: postgres1234
      JWT_SECRET: "ferreteria-secret-key-super-segura-2024-minimo-32-chars"
      JWT_EXPIRATION: 3600000
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka
      EUREKA_INSTANCE_HOSTNAME: ms-auth
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      GLITCHTIP_DSN: ${GLITCHTIP_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-docker}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8081'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - ferreteria-net

  # -----------------------------------------------------------
  # MS-PRODUCT — Catálogo de Productos (Puerto 8082, interno)
  # -----------------------------------------------------------
  ms-product:
    build: ./ms-product
    container_name: ms-product
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: product_db
      DB_USER: postgres
      DB_PASSWORD: postgres1234
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka
      EUREKA_INSTANCE_HOSTNAME: ms-product
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      GLITCHTIP_DSN: ${GLITCHTIP_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-docker}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8082'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - ferreteria-net

  # -----------------------------------------------------------
  # MS-INVENTORY — Stock por Producto y Bodega (Puerto 8083, interno)
  # -----------------------------------------------------------
  ms-inventory:
    build: ./ms-inventory
    container_name: ms-inventory
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: inventory_db
      DB_USER: postgres
      DB_PASSWORD: postgres1234
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka
      EUREKA_INSTANCE_HOSTNAME: ms-inventory
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      GLITCHTIP_DSN: ${GLITCHTIP_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-docker}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8083'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - ferreteria-net

  # -----------------------------------------------------------
  # MS-SALES — Ventas (Puerto 8084, interno)
  # -----------------------------------------------------------
  # Al registrar una venta:
  #   1. Verifica que el producto existe en ms-product (vía Eureka)
  #   2. Descuenta el stock en ms-inventory (vía Eureka)
  #   3. Notifica a ms-notification si el stock queda bajo (vía Eureka)
  # -----------------------------------------------------------
  ms-sales:
    build: ./ms-sales
    container_name: ms-sales
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: sales_db
      DB_USER: postgres
      DB_PASSWORD: postgres1234
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka
      EUREKA_INSTANCE_HOSTNAME: ms-sales
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      GLITCHTIP_DSN: ${GLITCHTIP_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-docker}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8084'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - ferreteria-net

  # -----------------------------------------------------------
  # MS-NOTIFICATION — Alertas y Notificaciones (Puerto 8085, interno)
  # -----------------------------------------------------------
  ms-notification:
    build: ./ms-notification
    container_name: ms-notification
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: notification_db
      DB_USER: postgres
      DB_PASSWORD: postgres1234
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka
      EUREKA_INSTANCE_HOSTNAME: ms-notification
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      GLITCHTIP_DSN: ${GLITCHTIP_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-docker}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8085'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - ferreteria-net

  # -----------------------------------------------------------
  # MS-SUPPLIER — Proveedores (Puerto 8086, interno)
  # -----------------------------------------------------------
  ms-supplier:
    build: ./ms-supplier
    container_name: ms-supplier
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: supplier_db
      DB_USER: postgres
      DB_PASSWORD: postgres1234
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka
      EUREKA_INSTANCE_HOSTNAME: ms-supplier
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      GLITCHTIP_DSN: ${GLITCHTIP_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-docker}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8086'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - ferreteria-net

  # -----------------------------------------------------------
  # MS-PURCHASE — Órdenes de Compra a Proveedores (Puerto 8087, interno)
  # -----------------------------------------------------------
  # Al confirmar una orden, incrementa stock en ms-inventory (vía Eureka).
  # -----------------------------------------------------------
  ms-purchase:
    build: ./ms-purchase
    container_name: ms-purchase
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      eureka:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: purchase_db
      DB_USER: postgres
      DB_PASSWORD: postgres1234
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka
      EUREKA_INSTANCE_HOSTNAME: ms-purchase
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      GLITCHTIP_DSN: ${GLITCHTIP_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-docker}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8087'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - ferreteria-net

  # -----------------------------------------------------------
  # MS-REPORT — Reportería de solo lectura, SIN base de datos (Puerto 8088, interno)
  # -----------------------------------------------------------
  # Agrega datos de ms-sales, ms-inventory y ms-product vía Eureka.
  # -----------------------------------------------------------
  ms-report:
    build: ./ms-report
    container_name: ms-report
    restart: always
    depends_on:
      eureka:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka
      EUREKA_INSTANCE_HOSTNAME: ms-report
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      GLITCHTIP_DSN: ${GLITCHTIP_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-docker}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8088'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - ferreteria-net

  # -----------------------------------------------------------
  # MS-PRICING — Cálculo de Precios y Descuentos, SIN base de datos (Puerto 8091, interno)
  # -----------------------------------------------------------
  ms-pricing:
    build: ./ms-pricing
    container_name: ms-pricing
    restart: always
    depends_on:
      eureka:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka
      EUREKA_INSTANCE_HOSTNAME: ms-pricing
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      GLITCHTIP_DSN: ${GLITCHTIP_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-docker}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8091'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - ferreteria-net

  # -----------------------------------------------------------
  # BFF-SERVICE — Backend For Frontend (Puerto 8090, interno)
  # -----------------------------------------------------------
  # Ya no es el punto de entrada público (ese rol lo cumple ahora
  # apigateway en el 8080). Conserva toda su lógica de orquestación
  # y seguridad JWT actual. Resuelve los 9 microservicios vía Eureka
  # + Spring Cloud LoadBalancer en lugar de URLs fijas.
  # -----------------------------------------------------------
  bff-service:
    build: ./bff
    container_name: bff
    restart: always
    depends_on:
      eureka:
        condition: service_healthy
      ms-auth:
        condition: service_started
      ms-product:
        condition: service_started
      ms-inventory:
        condition: service_started
      ms-sales:
        condition: service_started
      ms-notification:
        condition: service_started
      ms-supplier:
        condition: service_started
      ms-purchase:
        condition: service_started
      ms-report:
        condition: service_started
      ms-pricing:
        condition: service_started
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka
      EUREKA_INSTANCE_HOSTNAME: bff
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      GLITCHTIP_DSN: ${GLITCHTIP_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-docker}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8090'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - ferreteria-net

  # -----------------------------------------------------------
  # GLITCHTIP — Observabilidad y logging centralizado (Puerto 8000)
  # -----------------------------------------------------------
  glitchtip:
    image: glitchtip/glitchtip:latest
    container_name: glitchtip
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - postgresGt
      - redisGt
    environment:
      DATABASE_URL: postgres://glitchtip:glitchtip1234@postgresGt:5432/glitchtip
      GLITCHTIP_DOMAIN: http://localhost:8000
      GLITCHTIP_EMBED_WORKER: "true"
      REDIS_URL: redis://redisGt:6379/0
      SECRET_KEY: ferreteria-glitchtip-secret-key-change-me
      DEFAULT_FROM_EMAIL: noreply@ferreteria.local
    volumes:
      - glitchtip_media:/code/media
    networks:
      - ferreteria-net

  postgresGt:
    image: postgres:17-alpine
    container_name: glitchtip-db
    restart: always
    environment:
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: glitchtip1234
      POSTGRES_DB: glitchtip
    volumes:
      - glitchtip_postgres_data:/var/lib/postgresql/data
    networks:
      - ferreteria-net

  redisGt:
    image: redis:7-alpine
    container_name: glitchtip-redis
    restart: always
    networks:
      - ferreteria-net

networks:
  ferreteria-net:
    driver: bridge

volumes:
  postgres_data:
  glitchtip_postgres_data:
  glitchtip_media:
