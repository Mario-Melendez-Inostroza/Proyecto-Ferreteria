spring.application.name=ms-notification
server.port=8085
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:8094}/${DB_NAME:notification}
spring.datasource.username=${DB_USER:notification}
spring.datasource.password=${DB_PASSWORD:notification}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=15

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# GlitchTip
sentry.dsn=${GLITCHTIP_DSN:}
sentry.environment=${SENTRY_ENVIRONMENT:local}
sentry.traces-sample-rate=${SENTRY_TRACES_SAMPLE_RATE:0.1}
sentry.send-default-pii=false
sentry.logs.enabled=true
sentry.logging.minimum-level=info
sentry.logging.minimum-event-level=error
sentry.logging.minimum-breadcrumb-level=debug
sentry.exception-resolver-order=-2147483647
